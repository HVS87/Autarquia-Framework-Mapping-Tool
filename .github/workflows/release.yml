# Aplicação de secretária: a cada etiqueta v* compila para Windows, Mac e
# Linux, cada um no seu sistema, e junta os ficheiros à Release do GitHub.
# Antes de compilar: o varrimento estático e o QR lido por um leitor
# independente. Também se pode lançar à mão (workflow_dispatch): aí os
# ficheiros ficam só como artefactos.
name: Release (aplicação de secretária)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: win
            nome: Windows (portátil e instalador)
          - os: macos-latest
            alvo: mac
            nome: Mac (Apple e Intel)
          - os: ubuntu-latest
            alvo: linux
            nome: Linux (AppImage e .deb)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Varrimento estático (sintaxe, referências, ortografia)
        run: node ../qa/estatico.mjs

      - name: O código QR da sincronização lê-se
        run: node ../qa/qr.mjs

      - name: Compilar
        run: npm run build:${{ matrix.alvo }}
        env:
          # Sem certificado de programador: a aplicação sai sem assinatura
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Mac — a assinatura ad-hoc está lá e é válida
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature=adhoc|Identifier="
          done

      - name: Linux — o AppImage abre-se e o .deb está bem formado
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --appimage-extract >/dev/null
          test -x "squashfs-root/mapeamento-autarquias"
          dpkg-deb --info dist/*.deb | grep -E "Package|Version"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mapeamento-autarquias-${{ matrix.alvo }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac-*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

      - name: Juntar à Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Mapeamento para Autarquias ${{ github.ref_name }}
          body_path: desktop/notas-da-versao.md
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac-*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          fail_on_unmatched_files: false
